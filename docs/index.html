<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>javbrain</title>
<style>
:root {
  --font-body: sans-serif;
  --font-size: 18px;
  --line-height: 1.4;
  --cell-padding: 4px 8px;
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #1a1a1a;
  --text-muted: #888888;
  --border-color: #d0d0d0;
  --highlight-bg: #fff3a8;
  --highlight-text: #1a1a1a;
  --bottom-bar-bg: #f0f0f0;
  --row-hover: #f7f7f7;
  --selected-row: #e8e8ff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  font-size: var(--font-size);
  line-height: var(--line-height);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
}

body { display: flex; flex-direction: column; }

* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) var(--bg-primary);
}
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: var(--bg-primary); }
*::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

#table-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }

thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: var(--cell-padding);
  text-align: left; font-weight: 600;
  color: var(--text-muted);
  font-size: calc(var(--font-size) - 1px);
  text-transform: uppercase; letter-spacing: 0.05em;
  user-select: none;
}

th.col-name { width: 100%; }

tbody tr { border-bottom: 1px solid var(--border-color); cursor: pointer; }
tbody tr:hover { background: var(--row-hover); }
tbody tr.selected { background: var(--selected-row); }

td {
  padding: var(--cell-padding);
  vertical-align: top; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

td.cell-name { font-weight: 500; }
td.cell-name .ext { color: var(--text-muted); font-weight: 400; }
td.cell-name .arrow {
  display: inline-block; width: 14px;
  color: var(--text-muted); font-size: 10px;
  text-align: center; margin-right: 4px;
}

tr.match-line { border-bottom: none; cursor: pointer; }
tr.match-line td {
  padding: 1px 8px 1px 30px;
  white-space: pre-wrap; word-break: break-word;
  color: var(--text-muted); font-size: calc(var(--font-size) - 1px);
}
tr.match-line:hover td { color: var(--text-primary); }

mark { background: var(--highlight-bg); color: var(--highlight-text); padding: 0 1px; border-radius: 1px; }

.no-results { text-align: center; padding: 40px; color: var(--text-muted); }

#bottom-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; background: var(--bottom-bar-bg);
  border-top: 1px solid var(--border-color);
  font-size: calc(var(--font-size) - 1px);
  color: var(--text-muted); user-select: none; min-height: 28px;
}

.bar-cmd { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; white-space: nowrap; }
.bar-cmd kbd {
  display: inline-block; padding: 0 4px;
  border: 1px solid var(--border-color); border-radius: 2px;
  background: var(--bg-primary); font-family: inherit;
  font-size: inherit; line-height: 1.6; min-width: 18px; text-align: center;
}
.bar-spacer { flex: 1; }
.bar-status { color: var(--text-muted); padding: 0 6px; }

#search-bar {
  display: none; flex-shrink: 0; align-items: center; gap: 8px;
  padding: 4px 8px; background: var(--bottom-bar-bg);
  border-top: 1px solid var(--border-color); min-height: 28px;
  max-width: 100%;
}
#search-bar.active { display: flex; }

#search-input {
  flex: 1; min-width: 0; background: var(--bg-primary);
  border: 1px solid var(--border-color); color: var(--text-primary);
  font-family: var(--font-body); font-size: var(--font-size);
  padding: 2px 6px; outline: none;
}
#search-input:focus { border-color: var(--text-muted); }

#search-mode {
  font-size: calc(var(--font-size) - 1px); color: var(--text-muted);
  padding: 1px 6px; border: 1px solid var(--border-color); border-radius: 2px;
  background: var(--bg-secondary); cursor: default; user-select: none;
  min-width: 50px; text-align: center;
}

#search-info { font-size: calc(var(--font-size) - 1px); color: var(--text-muted); white-space: nowrap; }

.setting-dropdown {
  position: fixed; bottom: 32px; background: var(--bg-primary);
  border: 1px solid var(--border-color); padding: 4px 0; z-index: 100;
  font-size: calc(var(--font-size) - 1px); box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
  max-height: 60vh; overflow-y: auto;
}
.setting-dropdown .opt { padding: 2px 12px; cursor: pointer; white-space: nowrap; }
.setting-dropdown .opt:hover { background: var(--row-hover); }
.setting-dropdown .opt.active { font-weight: 700; }
.setting-dropdown .opt.focused { background: var(--highlight-bg); color: var(--highlight-text); }

/* Touch bar — hidden on desktop */
#touch-bar {
  display: none; flex-shrink: 0; align-items: center; justify-content: center; gap: 2px;
  padding: 4px 8px; background: var(--bottom-bar-bg);
  border-top: 1px solid var(--border-color); min-height: 36px;
}
#touch-bar .tb {
  padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 3px;
  background: var(--bg-primary); color: var(--text-primary); font-family: inherit;
  font-size: calc(var(--font-size) - 2px); cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1.4;
}
#touch-bar .tb:active { background: var(--highlight-bg); color: var(--highlight-text); }
#touch-bar .bar-spacer { flex: 1; }
#touch-bar .bar-status { color: var(--text-muted); font-size: calc(var(--font-size) - 2px); }

/* Inline mobile search buttons — hidden on desktop */
.search-m {
  display: none; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 3px;
  background: var(--bg-primary); color: var(--text-primary); font-family: inherit;
  font-size: calc(var(--font-size) - 2px); cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1.4;
}
.search-m:active { background: var(--highlight-bg); color: var(--highlight-text); }

@media (max-width: 600px) {
  #bottom-bar { display: none !important; }
  #touch-bar { display: flex; }
  #search-bar .bar-cmd { display: none; }
  #search-bar .search-m { display: inline-block; }
  #search-bar { gap: 4px; }
  #search-bar > span:first-child { display: none; }
  #search-mode { min-width: 0; font-size: calc(var(--font-size) - 3px); padding: 1px 4px; }
  #search-info { display: none; }
  #search-input { min-width: 0; font-size: calc(var(--font-size) - 2px); }
  .no-results { padding: 20px; }
}
</style>
</head>
<body>

<div id="table-wrap">
  <table>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="search-bar">
  <span style="color:var(--text-muted)">Search:</span>
  <input id="search-input" type="text" aria-label="Search files" autocomplete="off" spellcheck="false">
  <div id="search-mode">fuzzy</div>
  <div id="search-info"></div>
  <span class="bar-cmd" style="color:var(--text-muted)"><kbd>Tab</kbd> mode</span>
  <span class="bar-cmd" style="color:var(--text-muted)"><kbd>Esc</kbd> close</span>
  <button class="tb search-m" data-act="mode">mode</button>
  <button class="tb search-m" data-act="close">&#x2715;</button>
</div>

<div id="bottom-bar">
  <span class="bar-cmd"><kbd>Space</kbd> Search</span>
  <span class="bar-cmd"><kbd>T</kbd> <span id="theme-label">Theme</span></span>
  <span class="bar-cmd"><kbd>F</kbd> <span id="font-label">Font</span></span>
  <span class="bar-cmd"><kbd>&uarr;&darr;</kbd> Navigate</span>
  <span class="bar-cmd"><kbd>&larr;&rarr;</kbd> Fold</span>
  <span class="bar-cmd"><kbd>Enter</kbd> Open</span>
  <span class="bar-spacer"></span>
  <span class="bar-status" id="file-count"></span>
</div>

<div id="touch-bar">
  <button class="tb" data-act="search">&#x2315;</button>
  <button class="tb" data-act="theme">T</button>
  <button class="tb" data-act="font">F</button>
  <button class="tb" data-act="up">&uarr;</button>
  <button class="tb" data-act="down">&darr;</button>
  <button class="tb" data-act="left">&larr;</button>
  <button class="tb" data-act="right">&rarr;</button>
  <button class="tb" data-act="open">&#x23CE;</button>
  <span class="bar-spacer"></span>
  <span class="bar-status" id="file-count-m"></span>
</div>

<script>
(function() {
  'use strict';

  const V = 'mnhh8kqz';
  function vfetch(url) { return fetch(url + '?v=' + V); }

  let fileData = [];
  let searchIndex = null;
  let filteredIndices = null;
  let selectedRow = 0;
  let searchActive = false;
  let searchModes = ['fuzzy', 'all', 'any', 'exact', 'names'];
  let searchModeIdx = 0;
  let activeDropdown = null;
  let debounceTimer = null;

  let expandedFiles = new Set();
  let fileContentCache = {};
  let fileMatchLines = {};

  // Flat row list: [{type:'file',fi}, {type:'line',fi,lineNum}, {type:'empty',fi}]
  let flatRows = [];

  const SNIPPET_RADIUS = 60;

  let themes = {};
  let themeKeys = [];
  let currentTheme = localStorage.getItem('jb-theme') || 'dark';

  // Fonts — populated at init from fontfaces.json
  let FONTS = [];
  let currentFont = parseInt(localStorage.getItem('jb-font') || '0');

  const tbody = document.getElementById('tbody');
  const bottomBar = document.getElementById('bottom-bar');
  const searchBar = document.getElementById('search-bar');
  const searchInput = document.getElementById('search-input');
  const searchModeEl = document.getElementById('search-mode');
  const searchInfo = document.getElementById('search-info');
  const fileCount = document.getElementById('file-count');

  // Inject @font-face rules from fontfaces.json data
  function injectFontFaces(fontfaces) {
    let css = '';
    for (const family of fontfaces) {
      for (const face of family.faces) {
        const srcParts = face.src.map(s => "url('" + s.url + "') format('" + s.format + "')").join(', ');
        css += '@font-face {\n' +
          "  font-family: '" + family.family + "';\n" +
          '  src: ' + srcParts + ';\n' +
          '  font-weight: ' + face.weight + ';\n' +
          '  font-style: ' + face.style + ';\n' +
          '}\n';
      }
    }
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  }

  async function init() {
    // Load config (themes.json — restructured with defaults + themes)
    let config;
    try {
      const res = await vfetch('themes.json');
      config = await res.json();
    } catch(e) {
      config = { defaults: {}, themes: { light: { name: 'Light', vars: {} }, dark: { name: 'Dark', vars: {} } } };
    }
    const defaults = config.defaults || {};
    themes = config.themes || {};
    themeKeys = Object.keys(themes);
    if (!defaults.theme) defaults.theme = 'dark';
    if (!themes[currentTheme]) currentTheme = defaults.theme;
    if (!themes[currentTheme]) currentTheme = themeKeys[0];

    // Apply display defaults
    if (defaults.fontSize) document.documentElement.style.setProperty('--font-size', defaults.fontSize);
    if (defaults.lineHeight) document.documentElement.style.setProperty('--line-height', defaults.lineHeight);

    // Load fontfaces.json — auto-generated by build.js from fonts/ dir
    try {
      const res = await vfetch('fontfaces.json');
      const fontfaces = await res.json();
      injectFontFaces(fontfaces);
      FONTS = fontfaces.map(f => ({ label: f.label || f.family, value: "'" + f.family + "', sans-serif" }));
    } catch(e) {
      FONTS = [];
    }
    if (currentFont >= FONTS.length) currentFont = 0;

    const dataRes = await vfetch('data.json');
    fileData = await dataRes.json();

    try {
      const idxRes = await vfetch('index.json');
      if (idxRes.ok) {
        searchIndex = await idxRes.json();
      } else { throw new Error('x'); }
    } catch(e) {
      try {
        const mRes = await vfetch('index-manifest.json');
        if (mRes.ok) {
          const manifest = await mRes.json();
          searchIndex = {};
          const results = await Promise.all(Object.values(manifest).map(f => vfetch(f).then(r => r.json())));
          for (const chunk of results) Object.assign(searchIndex, chunk);
        }
      } catch(e2) {}
    }

    applyTheme();
    applyFont();
    renderTable();
    fileCount.textContent = fileData.length + ' files';
    const fcm = document.getElementById('file-count-m');
    if (fcm) fcm.textContent = fileData.length;
  }

  function applyTheme() {
    const t = themes[currentTheme]; if (!t) return;
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
    localStorage.setItem('jb-theme', currentTheme);
    document.getElementById('theme-label').textContent = t.name || currentTheme;
  }
  function cycleTheme() {
    currentTheme = themeKeys[(themeKeys.indexOf(currentTheme) + 1) % themeKeys.length];
    applyTheme();
  }

  function applyFont() {
    if (FONTS.length === 0) return;
    document.documentElement.style.setProperty('--font-body', FONTS[currentFont].value);
    localStorage.setItem('jb-font', currentFont);
    document.getElementById('font-label').textContent = FONTS[currentFont].label;
  }
  function cycleFont() {
    if (FONTS.length === 0) return;
    currentFont = (currentFont + 1) % FONTS.length;
    applyFont();
  }

  let dropdownIdx = -1;
  let dropdownAction = null;

  function openDropdown(opts, onSelect) {
    closeDropdown();
    const el = document.createElement('div');
    el.className = 'setting-dropdown';
    dropdownIdx = opts.findIndex(o => o.active);
    if (dropdownIdx < 0) dropdownIdx = 0;
    dropdownAction = onSelect;
    opts.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'opt' + (o.active ? ' active' : '') + (i === dropdownIdx ? ' focused' : '');
      d.textContent = o.label;
      d.addEventListener('click', () => { onSelect(i); closeDropdown(); });
      el.appendChild(d);
    });
    document.body.appendChild(el);
    activeDropdown = el;
    el.style.left = '8px';
    const f = el.querySelector('.opt.focused');
    if (f) f.scrollIntoView({ block: 'nearest' });
  }
  function closeDropdown() {
    if (activeDropdown) { activeDropdown.remove(); activeDropdown = null; dropdownAction = null; }
  }
  function dropdownNav(key) {
    if (!activeDropdown) return false;
    const items = activeDropdown.querySelectorAll('.opt');
    if (key === 'ArrowDown' || key === 'ArrowRight') {
      dropdownIdx = Math.min(dropdownIdx + 1, items.length - 1);
    } else if (key === 'ArrowUp' || key === 'ArrowLeft') {
      dropdownIdx = Math.max(dropdownIdx - 1, 0);
    } else if (key === 'Enter') {
      if (dropdownAction) dropdownAction(dropdownIdx);
      closeDropdown(); return true;
    } else if (key === 'Escape' || key === 'Tab') {
      closeDropdown(); return true;
    } else { return false; }
    items.forEach((el, i) => el.classList.toggle('focused', i === dropdownIdx));
    items[dropdownIdx].scrollIntoView({ block: 'nearest' });
    return true;
  }
  function openThemeDropdown() {
    if (activeDropdown) { closeDropdown(); return; }
    openDropdown(
      themeKeys.map(k => ({ label: themes[k].name || k, active: k === currentTheme })),
      i => { currentTheme = themeKeys[i]; applyTheme(); }
    );
  }
  function openFontDropdown() {
    if (FONTS.length === 0) return;
    if (activeDropdown) { closeDropdown(); return; }
    openDropdown(
      FONTS.map((f, i) => ({ label: f.label, active: i === currentFont })),
      i => { currentFont = i; applyFont(); }
    );
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function getFileContent(fi) {
    if (fileContentCache[fi] !== undefined) return fileContentCache[fi];
    try {
      const res = await vfetch('files/' + fi + '.txt');
      const text = await res.text();
      fileContentCache[fi] = text;
      return text;
    } catch(e) { return ''; }
  }

  function findMatchingLines(content, query) {
    const mode = searchModes[searchModeIdx];
    const lines = content.split('\n');
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (terms.length === 0) return [];

    const results = [];
    for (let i = 0; i < lines.length; i++) {
      const lower = lines[i].toLowerCase();
      let match = false;
      if (mode === 'exact') {
        match = lower.includes(query.toLowerCase());
      } else if (mode === 'any') {
        match = terms.some(t => lower.includes(t));
      } else {
        match = terms.every(t => lower.includes(t));
      }
      if (match) results.push({ lineNum: i + 1, text: lines[i] });
    }
    return results;
  }

  async function toggleExpand(fi) {
    if (expandedFiles.has(fi)) {
      expandedFiles.delete(fi);
      renderTable();
    } else {
      const content = await getFileContent(fi);
      fileMatchLines[fi] = findMatchingLines(content, searchInput.value);
      expandedFiles.add(fi);
      renderTable();
    }
  }

  function fileRowForFlat(flatIdx) {
    for (let i = flatIdx; i >= 0; i--) {
      if (flatRows[i].type === 'file') return i;
    }
    return -1;
  }

  function renderTable() {
    const indices = filteredIndices !== null ? filteredIndices : fileData.map((_, i) => i);
    flatRows = [];
    let html = '';
    const query = searchActive ? searchInput.value : '';
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);

    for (const fi of indices) {
      const f = fileData[fi];
      const flatIdx = flatRows.length;
      flatRows.push({ type: 'file', fi });
      const sel = (flatIdx === selectedRow) ? ' selected' : '';
      const nameParts = f.filename.match(/^(.+?)(\.[^.]+)$/) || [f.filename, f.filename, ''];
      const arrow = expandedFiles.has(fi) ? '&#9660;' : (searchActive && query ? '&#9654;' : '');
      html += '<tr class="' + sel + '" data-fi="' + fi + '" data-type="file" data-flat="' + flatIdx + '">';
      html += '<td class="cell-name"><span class="arrow">' + arrow + '</span>' +
        highlightText(nameParts[1], query, terms) +
        '<span class="ext">' + escHtml(nameParts[2] || '') + '</span></td>';
      html += '</tr>';

      if (expandedFiles.has(fi)) {
        const lines = fileMatchLines[fi] || [];
        for (const line of lines) {
          const mflatIdx = flatRows.length;
          flatRows.push({ type: 'line', fi, lineNum: line.lineNum });
          const msel = (mflatIdx === selectedRow) ? ' selected' : '';
          const snippet = getSnippet(line.text, query, terms);
          html += '<tr class="match-line' + msel + '" data-fi="' + fi + '" data-type="line" data-line="' + line.lineNum + '" data-flat="' + mflatIdx + '">';
          html += '<td>' + snippet + '</td></tr>';
        }
        if (lines.length === 0) {
          const eflatIdx = flatRows.length;
          flatRows.push({ type: 'empty', fi });
          html += '<tr class="match-line" data-fi="' + fi + '" data-type="empty" data-flat="' + eflatIdx + '"><td style="color:var(--text-muted);opacity:0.5">no matches in content</td></tr>';
        }
      }
    }

    if (indices.length === 0 && searchActive) {
      html = '<tr><td class="no-results">No matching files</td></tr>';
    }

    tbody.innerHTML = html;

    // Scroll selected into view
    const selEl = tbody.querySelector('tr.selected');
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function getSnippet(text, query, terms) {
    if (!query) return escHtml(text.slice(0, 120));
    const lower = text.toLowerCase();
    let firstIdx = text.length;
    if (searchModes[searchModeIdx] === 'exact') {
      const i = lower.indexOf(query.toLowerCase());
      if (i >= 0) firstIdx = i;
    } else {
      for (const t of terms) {
        const i = lower.indexOf(t);
        if (i >= 0 && i < firstIdx) firstIdx = i;
      }
    }
    const start = Math.max(0, firstIdx - SNIPPET_RADIUS);
    const end = Math.min(text.length, firstIdx + SNIPPET_RADIUS * 2);
    let snippet = text.slice(start, end);
    if (start > 0) snippet = '…' + snippet;
    if (end < text.length) snippet += '…';
    return highlightText(snippet, query, terms);
  }

  function highlightText(text, query, terms) {
    if (!query || terms.length === 0) return escHtml(text);
    if (terms.length === 0) return escHtml(text);
    let positions = [];
    const lower = text.toLowerCase();
    if (searchModes[searchModeIdx] === 'exact') {
      const q = query.toLowerCase();
      let pos = 0;
      while (true) { const idx = lower.indexOf(q, pos); if (idx === -1) break; positions.push([idx, idx + q.length]); pos = idx + 1; }
    } else {
      for (const term of terms) {
        let pos = 0;
        while (true) { const idx = lower.indexOf(term, pos); if (idx === -1) break; positions.push([idx, idx + term.length]); pos = idx + 1; }
      }
    }
    if (positions.length === 0) return escHtml(text);
    positions.sort((a, b) => a[0] - b[0]);
    const merged = [positions[0]];
    for (let i = 1; i < positions.length; i++) {
      const last = merged[merged.length - 1];
      if (positions[i][0] <= last[1]) last[1] = Math.max(last[1], positions[i][1]);
      else merged.push(positions[i]);
    }
    let result = '', prev = 0;
    for (const [s, e] of merged) {
      result += escHtml(text.slice(prev, s)) + '<mark>' + escHtml(text.slice(s, e)) + '</mark>';
      prev = e;
    }
    return result + escHtml(text.slice(prev));
  }

  async function doSearch(query) {
    const mode = searchModes[searchModeIdx];
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (terms.length === 0) {
      filteredIndices = null; expandedFiles.clear(); fileMatchLines = {};
      searchInfo.textContent = ''; selectedRow = 0; renderTable(); return;
    }
    let matchingFiles;
    if (mode === 'names') {
      // Filename-only search — fast, no index scan
      matchingFiles = [];
      fileData.forEach((f, i) => {
        const fn = f.filename.toLowerCase();
        if (terms.every(t => fn.includes(t))) matchingFiles.push(i);
      });
    } else if (mode === 'exact') {
      const firstWord = (query.toLowerCase().match(/[a-z0-9]+/) || [''])[0];
      if (!firstWord) { filteredIndices = []; renderTable(); return; }
      const entries = searchIndex ? (searchIndex[firstWord] || []) : [];
      const candidates = new Set(entries.map(e => e.file));
      fileData.forEach((f, i) => { if (f.filename.toLowerCase().includes(query.toLowerCase())) candidates.add(i); });
      matchingFiles = [...candidates];
    } else if (mode === 'fuzzy' || mode === 'all') {
      const fileSets = [];
      for (const term of terms) {
        const fileSet = new Set();
        if (searchIndex) {
          for (const word of Object.keys(searchIndex)) {
            if (mode === 'fuzzy' ? word.includes(term) : word.startsWith(term)) {
              for (const e of searchIndex[word]) fileSet.add(e.file);
            }
          }
        }
        fileData.forEach((f, i) => { if (f.filename.toLowerCase().includes(term)) fileSet.add(i); });
        fileSets.push(fileSet);
      }
      if (fileSets.length === 0) matchingFiles = [];
      else {
        matchingFiles = [...fileSets[0]];
        for (let i = 1; i < fileSets.length; i++) matchingFiles = matchingFiles.filter(f => fileSets[i].has(f));
      }
    } else {
      const fileSet = new Set();
      for (const term of terms) {
        if (searchIndex) {
          for (const word of Object.keys(searchIndex)) {
            if (word.startsWith(term)) { for (const e of searchIndex[word]) fileSet.add(e.file); }
          }
        }
        fileData.forEach((f, i) => { if (f.filename.toLowerCase().includes(term)) fileSet.add(i); });
      }
      matchingFiles = [...fileSet];
    }
    matchingFiles.sort((a, b) => a - b);
    filteredIndices = matchingFiles;
    selectedRow = 0;
    expandedFiles.clear(); fileMatchLines = {};
    searchInfo.textContent = matchingFiles.length + ' match' + (matchingFiles.length !== 1 ? 'es' : '');
    renderTable();

    // Auto-expand all — skip on mobile or names mode
    if (mode === 'names' || isMobile()) return;
    const expandPromises = matchingFiles.map(fi =>
      getFileContent(fi).then(content => {
        fileMatchLines[fi] = findMatchingLines(content, query);
        expandedFiles.add(fi);
      })
    );
    await Promise.all(expandPromises);
    renderTable();
  }

  function openFile(fileIndex, lineNum) {
    let hash = '' + fileIndex;
    if (lineNum) hash += ':' + lineNum;
    const query = searchActive ? searchInput.value : '';
    if (query) hash += ':' + encodeURIComponent(query);
    window.open('viewer.html#' + hash, '_blank');
  }

  function handleNav(key, ctrl) {
    if (key === 'ArrowDown') {
      if (flatRows.length > 0) {
        let next = selectedRow + 1;
        while (next < flatRows.length && flatRows[next].type === 'empty') next++;
        if (next < flatRows.length) { selectedRow = next; renderTable(); }
      }
    } else if (key === 'ArrowUp') {
      if (selectedRow > 0) {
        let prev = selectedRow - 1;
        while (prev > 0 && flatRows[prev].type === 'empty') prev--;
        selectedRow = prev; renderTable();
      }
    } else if (key === 'ArrowRight') {
      if (ctrl) {
        // Expand all
        const indices = filteredIndices !== null ? filteredIndices : [];
        const promises = indices.map(fi => {
          if (!expandedFiles.has(fi)) {
            return getFileContent(fi).then(content => {
              fileMatchLines[fi] = findMatchingLines(content, searchInput.value);
              expandedFiles.add(fi);
            });
          }
        });
        Promise.all(promises).then(() => renderTable());
      } else {
        const row = flatRows[selectedRow];
        if (!row) return;
        if (row.type === 'file' && !expandedFiles.has(row.fi)) {
          toggleExpand(row.fi);
        }
      }
    } else if (key === 'ArrowLeft') {
      if (ctrl) {
        // Collapse all
        expandedFiles.clear();
        renderTable();
      } else {
        const row = flatRows[selectedRow];
        if (!row) return;
        if (row.type === 'line' || row.type === 'empty') {
          const parentIdx = fileRowForFlat(selectedRow);
          if (parentIdx >= 0) { selectedRow = parentIdx; renderTable(); }
        } else if (row.type === 'file' && expandedFiles.has(row.fi)) {
          expandedFiles.delete(row.fi);
          renderTable();
        }
      }
    } else if (key === 'Enter') {
      const row = flatRows[selectedRow];
      if (!row) return;
      if (row.type === 'line') openFile(row.fi, row.lineNum);
      else if (row.type === 'file') openFile(row.fi);
    }
  }

  document.addEventListener('keydown', function(e) {
    if (activeDropdown) {
      e.preventDefault();
      dropdownNav(e.key);
      return;
    }
    if (searchActive) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeSearch();
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        searchModeIdx = (searchModeIdx + 1) % searchModes.length;
        searchModeEl.textContent = searchModes[searchModeIdx];
        if (searchInput.value) { clearTimeout(debounceTimer); doSearch(searchInput.value); }
        return;
      }
      if (['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault(); handleNav(e.key, e.ctrlKey); return;
      }
      if (e.key === 'Enter') { e.preventDefault(); handleNav('Enter', false); return; }
      return;
    }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault(); openSearch(); return;
    }
    const k = e.key.toLowerCase();
    if (k === 't' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openThemeDropdown(); return; }
    if (k === 'f' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openFontDropdown(); return; }
    if (['ArrowDown','ArrowUp'].includes(e.key)) {
      e.preventDefault(); handleNav(e.key, e.ctrlKey); return;
    }
    if (e.key === 'Enter') { e.preventDefault(); handleNav('Enter', false); return; }
  });

  searchInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => doSearch(searchInput.value), 150);
  });

  tbody.addEventListener('click', function(e) {
    const tr = e.target.closest('tr');
    if (!tr) return;
    const flatIdx = tr.dataset.flat;
    if (flatIdx !== undefined) selectedRow = parseInt(flatIdx);
    const fi = tr.dataset.fi;
    if (fi === undefined) return;
    if (tr.dataset.type === 'line') {
      openFile(parseInt(fi), parseInt(tr.dataset.line));
    } else if (tr.dataset.type === 'file') {
      if (searchActive && searchInput.value) toggleExpand(parseInt(fi));
      else openFile(parseInt(fi));
    }
  });

  // --- Search open/close helpers ---
  function isMobile() { return window.innerWidth <= 600; }

  function openSearch() {
    searchActive = true; searchBar.classList.add('active');
    bottomBar.style.display = 'none';
    if (isMobile() && searchModes[searchModeIdx] !== 'names') {
      searchModeIdx = searchModes.indexOf('names');
      searchModeEl.textContent = 'names';
    }
    searchInput.focus();
  }
  function closeSearch() {
    const wrap = document.getElementById('table-wrap');
    const scrollPos = wrap.scrollTop;
    searchActive = false; searchBar.classList.remove('active');
    bottomBar.style.display = 'flex'; searchInput.value = '';
    filteredIndices = null; selectedRow = 0;
    expandedFiles.clear(); fileMatchLines = {};
    searchInfo.textContent = ''; renderTable();
    wrap.scrollTop = scrollPos;
  }

  // --- Touch bar wiring ---
  document.querySelectorAll('#touch-bar .tb, .search-m').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const act = this.dataset.act;
      if (act === 'search') openSearch();
      else if (act === 'theme') openThemeDropdown();
      else if (act === 'font') openFontDropdown();
      else if (act === 'up') handleNav('ArrowUp', false);
      else if (act === 'down') handleNav('ArrowDown', false);
      else if (act === 'left') handleNav('ArrowLeft', false);
      else if (act === 'right') handleNav('ArrowRight', false);
      else if (act === 'open') handleNav('Enter', false);
      else if (act === 'mode') {
        searchModeIdx = (searchModeIdx + 1) % searchModes.length;
        searchModeEl.textContent = searchModes[searchModeIdx];
        if (searchInput.value) { clearTimeout(debounceTimer); doSearch(searchInput.value); }
      }
      else if (act === 'close') closeSearch();
    });
  });

  init();
})();
</script>
</body>
</html>
