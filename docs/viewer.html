<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>javbrain — viewer</title>
<style>
:root {
  --font-body: sans-serif;
  --font-size: 18px;
  --line-height: 1.4;
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #1a1a1a;
  --text-muted: #888888;
  --border-color: #d0d0d0;
  --text-margin: 40px;
  --text-align: justify;
  --text-line-height: 1.6;
  --highlight-bg: #fff3a8;
  --highlight-text: #1a1a1a;
  --depth-0: #4E8F6B;
  --depth-1: #CB9434;
  --depth-2: #CD5048;
  --depth-3: #C04C89;
  --depth-4: #9A6BB4;
  --depth-5: #387DC9;
  --depth-bg-mix: 10%;
  --depth-border-mix: 25%;
  --depth-rule-mix: 15%;
  --callout-bg: #2a1f00;
  --callout-border: #b8960e;
  --quote-color: #a0b0c0;
  --bottom-bar-bg: #f0f0f0;
  --row-hover: #f7f7f7;
  --toc-width: 30%;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  font-size: var(--font-size);
  line-height: var(--text-line-height);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
}

body { display: flex; flex-direction: column; }

/* Themed scrollbars */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) var(--bg-primary);
}
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: var(--bg-primary); }
*::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

#main {
  flex: 1; display: flex; overflow: hidden;
}

/* TOC sidebar — hidden by default, shown on focus */
#toc {
  width: var(--toc-width);
  min-width: 25%;
  max-width: 40%;
  border-right: 1px solid var(--border-color);
  overflow-y: auto;
  padding: 12px 0;
  font-size: calc(var(--font-size) - 4px);
  flex-shrink: 0;
  background: var(--bg-primary);
  display: none;
}

#toc.focused {
  display: block;
  background: var(--bg-secondary);
}

#toc .toc-hint {
  padding: 4px 12px;
  color: var(--text-muted);
  font-size: calc(var(--font-size) - 6px);
  opacity: 0.6;
  user-select: none;
}

.toc-item {
  padding: 3px 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-muted);
  user-select: none;
}
.toc-item:hover { color: var(--text-primary); }
.toc-item.selected {
  background: var(--highlight-bg);
  color: var(--highlight-text);
}
.toc-item .toc-arrow {
  display: inline-block;
  width: 12px;
  font-size: 9px;
  text-align: center;
  margin-right: 2px;
}
.toc-item.depth-0 { padding-left: 12px; font-weight: 600; color: var(--text-primary); }
.toc-item.depth-1 { padding-left: 26px; }
.toc-item.depth-2 { padding-left: 40px; }
.toc-item.depth-3 { padding-left: 54px; }
.toc-item.depth-4 { padding-left: 68px; }
.toc-item.hidden { display: none; }

/* No TOC */
#toc.empty { display: none; }
#toc.empty.focused { display: none; }
#toc.empty + #viewer { margin-left: 0; }

/* Viewer */
#viewer {
  flex: 1;
  overflow-y: auto;
  padding: var(--text-margin);
  text-align: var(--text-align);
  outline: none;
}

pre.txt-content {
  white-space: pre-wrap; word-wrap: break-word;
  font-family: var(--font-body);
  font-size: var(--font-size);
  line-height: var(--text-line-height);
}

.jav-block { margin: 8px 0; }

.jav-block-label {
  display: block;
  text-align: left;
  font-weight: 600; color: var(--text-muted);
  letter-spacing: 0.03em; margin-bottom: 2px;
  font-size: calc(var(--font-size) * 2);
}
.jav-block[data-depth="0"] > .jav-block-label { text-align: center; }
.jav-block[data-depth="1"] > .jav-block-label { font-size: calc(var(--font-size) * 1.3); }
.jav-block[data-depth="2"] > .jav-block-label { font-size: calc(var(--font-size) * 1.2); }
.jav-block[data-depth="3"] > .jav-block-label { font-size: calc(var(--font-size) * 1.15); }
.jav-block[data-depth="4"] > .jav-block-label { font-size: calc(var(--font-size) * 1.1); }
.jav-block[data-depth="5"] > .jav-block-label,
.jav-block[data-depth="6"] > .jav-block-label,
.jav-block[data-depth="7"] > .jav-block-label,
.jav-block[data-depth="8"] > .jav-block-label,
.jav-block[data-depth="9"] > .jav-block-label,
.jav-block[data-depth="10"] > .jav-block-label,
.jav-block[data-depth="11"] > .jav-block-label { font-size: calc(var(--font-size) * 1.05); }


/* Depth-based tinting — 6 colors from theme, repeating */
.jav-block[data-depth="0"] > .jav-block-body { --dc: var(--depth-0); }
.jav-block[data-depth="1"] > .jav-block-body { --dc: var(--depth-1); margin-left: 8px; }
.jav-block[data-depth="2"] > .jav-block-body { --dc: var(--depth-2); margin-left: 8px; }
.jav-block[data-depth="3"] > .jav-block-body { --dc: var(--depth-3); margin-left: 8px; }
.jav-block[data-depth="4"] > .jav-block-body { --dc: var(--depth-4); margin-left: 8px; }
.jav-block[data-depth="5"] > .jav-block-body { --dc: var(--depth-5); margin-left: 8px; }
.jav-block[data-depth="6"] > .jav-block-body { --dc: var(--depth-0); margin-left: 8px; }
.jav-block[data-depth="7"] > .jav-block-body { --dc: var(--depth-1); margin-left: 8px; }
.jav-block[data-depth="8"] > .jav-block-body { --dc: var(--depth-2); margin-left: 8px; }
.jav-block[data-depth="9"] > .jav-block-body { --dc: var(--depth-3); margin-left: 8px; }
.jav-block[data-depth="10"] > .jav-block-body { --dc: var(--depth-4); margin-left: 8px; }
.jav-block[data-depth="11"] > .jav-block-body { --dc: var(--depth-5); margin-left: 8px; }

.jav-block-body {
  padding: 8px 12px; border-radius: 2px;
  background: color-mix(in srgb, var(--dc) var(--depth-bg-mix), transparent);
  border: 1px solid color-mix(in srgb, var(--dc) var(--depth-border-mix), transparent);
  --rule-color: color-mix(in srgb, var(--dc) var(--depth-rule-mix), transparent);
}

/* Ruled lines on each text element inside blocks */
.jav-block-body > .jav-para,
.jav-block-body > .jav-block > .jav-block-label {
  border-bottom: 1px solid var(--rule-color, transparent);
}

/* Toggle off depth styling */
.depth-lines-off .jav-block-body {
  background: transparent !important;
  border-color: transparent !important;
  --rule-color: transparent !important;
}
.depth-lines-off .jav-block-body > .jav-para,
.depth-lines-off .jav-block-body > .jav-block > .jav-block-label {
  border-bottom-color: transparent !important;
}

.jav-para {
  margin: 6px 0; padding: 2px 0;
  line-height: var(--text-line-height);
  text-indent: 10px;
}
.jav-para.list-line { text-indent: 0; text-align: left; padding-left: 2em; }

.txt-line {
  display: block; padding: 2px 0;
  text-indent: 10px;
}
.txt-line.list-line { text-indent: 0; text-align: left; padding-left: 2em; }

.jav-italic { font-style: italic; }
.jav-bold { font-weight: 700; }
.jav-quote { color: var(--quote-color); }
.jav-note { color: var(--text-muted); font-size: calc(var(--font-size) - 1px); }
.jav-callout {
  display: block; background: var(--callout-bg);
  border-left: 3px solid var(--callout-border);
  padding: 4px 10px; margin: 6px 0;
  color: var(--text-primary); font-size: calc(var(--font-size) - 1px);
}

#loading { color: var(--text-muted); padding: 40px; text-align: center; }

/* Flat/code rendering for ==== delimited files */
.flat-content {
  font-family: 'SF Mono','Cascadia Code','Fira Code','Consolas','Liberation Mono',monospace;
  font-size: 13px;
  line-height: 1.3;
  margin: calc(var(--text-margin) * -1);
  margin-bottom: 0;
}
.flat-section { margin: 0; padding: 0; }
.flat-section-label {
  display: block;
  padding: 6px 8px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.03em;
  user-select: none;
}
.flat-section pre {
  margin: 0;
  padding: 4px 8px;
  white-space: pre;
  overflow-x: auto;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  text-align: left;
}

mark { background: var(--highlight-bg); color: var(--highlight-text); padding: 0 1px; border-radius: 1px; }

.setting-dropdown {
  position: fixed; bottom: 8px; left: 8px; background: var(--bg-primary);
  border: 1px solid var(--border-color); padding: 4px 0; z-index: 100;
  font-size: calc(var(--font-size) - 1px); box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
  max-height: 60vh; overflow-y: auto;
}
.setting-dropdown .opt { padding: 2px 12px; cursor: pointer; white-space: nowrap; }
.setting-dropdown .opt:hover { background: var(--row-hover); }
.setting-dropdown .opt.active { font-weight: 700; }
.setting-dropdown .opt.focused { background: var(--highlight-bg); color: var(--highlight-text); }

/* Touch bar — hidden on desktop */
#touch-bar {
  display: none; flex-shrink: 0; align-items: center; justify-content: center; gap: 2px;
  padding: 4px 8px; background: var(--bottom-bar-bg);
  border-top: 1px solid var(--border-color); min-height: 36px;
}
#touch-bar .tb {
  padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 3px;
  background: var(--bg-primary); color: var(--text-primary); font-family: inherit;
  font-size: calc(var(--font-size) - 2px); cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1.4;
}
#touch-bar .tb:active { background: var(--highlight-bg); color: var(--highlight-text); }
#touch-bar .bar-spacer { flex: 1; }

@media (max-width: 600px) {
  #touch-bar { display: flex; }
  #toc .toc-hint { display: none; }
  #toc {
    display: none; position: fixed; left: 0; top: 0; bottom: 36px;
    width: 80%; max-width: 80%; min-width: 60%;
    z-index: 200; border-right: 1px solid var(--border-color);
    background: var(--bg-primary);
  }
  #toc.focused { display: none; }
  #toc.mobile-open { display: block; }
  #toc.empty.mobile-open { display: none; }
  #viewer { padding: 12px; overflow-x: hidden; }
  .flat-content { margin: -12px; margin-bottom: 0; }
}
</style>
</head>
<body>

<div id="main">
  <div id="toc" class="empty"></div>
  <div id="viewer" tabindex="-1">
    <div id="loading">Loading...</div>
  </div>
</div>

<div id="touch-bar">
  <button class="tb" data-act="toc">&#x2261;</button>
  <button class="tb" data-act="theme">T</button>
  <button class="tb" data-act="font">F</button>
  <button class="tb" data-act="lines">L</button>
</div>

<script>
(function() {
  'use strict';

  const V = 'mmshrml8';
  function vfetch(url) { return fetch(url + '?v=' + V); }

  const hashRaw = window.location.hash ? window.location.hash.slice(1) : null;
  if (!hashRaw) { document.getElementById('loading').textContent = 'No file specified.'; return; }
  const hashParts = hashRaw.split(':');
  const fileIdx = hashParts[0];
  const targetLine = hashParts[1] ? parseInt(hashParts[1]) : null;
  const searchQuery = hashParts[2] ? decodeURIComponent(hashParts.slice(2).join(':')) : null;

  // TOC state
  let tocItems = [];
  let tocSelected = 0;
  let tocFocused = false;

  // Theme state
  let themes = {};
  let themeKeys = [];
  let currentTheme = localStorage.getItem('jb-theme') || 'dark';

  // Fonts — populated at init from fontfaces.json
  let FONTS = [];
  let currentFont = parseInt(localStorage.getItem('jb-font') || '0');

  const tocEl = document.getElementById('toc');
  const viewerEl = document.getElementById('viewer');

  // Inject @font-face rules from fontfaces.json data
  function injectFontFaces(fontfaces) {
    let css = '';
    for (const family of fontfaces) {
      for (const face of family.faces) {
        const srcParts = face.src.map(s => "url('" + s.url + "') format('" + s.format + "')").join(', ');
        css += '@font-face {\n' +
          "  font-family: '" + family.family + "';\n" +
          '  src: ' + srcParts + ';\n' +
          '  font-weight: ' + face.weight + ';\n' +
          '  font-style: ' + face.style + ';\n' +
          '}\n';
      }
    }
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  }

  async function applySettings() {
    // Load config (themes.json — restructured with defaults + themes)
    let config;
    try {
      const res = await vfetch('themes.json');
      config = await res.json();
    } catch(e) {
      config = { defaults: {}, themes: { light: { name: 'Light', vars: {} }, dark: { name: 'Dark', vars: {} } } };
    }
    const defaults = config.defaults || {};
    themes = config.themes || {};
    themeKeys = Object.keys(themes);
    if (!defaults.theme) defaults.theme = 'dark';
    if (!themes[currentTheme]) currentTheme = defaults.theme;
    if (!themes[currentTheme]) currentTheme = themeKeys[0];

    // Apply display defaults
    if (defaults.fontSize) document.documentElement.style.setProperty('--font-size', defaults.fontSize);
    if (defaults.lineHeight) document.documentElement.style.setProperty('--line-height', defaults.lineHeight);
    if (defaults.textLineHeight) document.documentElement.style.setProperty('--text-line-height', defaults.textLineHeight);
    if (defaults.textMargin) document.documentElement.style.setProperty('--text-margin', defaults.textMargin);
    if (defaults.textAlign) document.documentElement.style.setProperty('--text-align', defaults.textAlign);
    if (defaults.tocWidth) document.documentElement.style.setProperty('--toc-width', defaults.tocWidth);

    // Load fontfaces.json — auto-generated by build.js from fonts/ dir
    try {
      const res = await vfetch('fontfaces.json');
      const fontfaces = await res.json();
      injectFontFaces(fontfaces);
      FONTS = fontfaces.map(f => ({ label: f.label || f.family, value: "'" + f.family + "', sans-serif" }));
    } catch(e) {
      FONTS = [];
    }
    if (currentFont >= FONTS.length) currentFont = 0;

    applyTheme();
    applyFont();
  }

  function applyTheme() {
    const t = themes[currentTheme];
    if (!t) return;
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
    localStorage.setItem('jb-theme', currentTheme);
    updateHint();
  }

  function cycleTheme() {
    currentTheme = themeKeys[(themeKeys.indexOf(currentTheme) + 1) % themeKeys.length];
    applyTheme();
  }

  function applyFont() {
    if (FONTS.length === 0) return;
    document.documentElement.style.setProperty('--font-body', FONTS[currentFont].value);
    localStorage.setItem('jb-font', currentFont);
    updateHint();
  }

  function updateHint() {
    const hint = tocEl.querySelector('.toc-hint');
    if (!hint) return;
    const tn = (themes[currentTheme] || {}).name || currentTheme;
    const fn = FONTS.length > 0 ? FONTS[currentFont].label : 'system';
    hint.textContent = '[Space] focus · [Enter] copy · [Right-click] copy · [T] ' + tn + ' · [F] ' + fn + ' · [L] lines';
  }
  function cycleFont() {
    if (FONTS.length === 0) return;
    currentFont = (currentFont + 1) % FONTS.length;
    applyFont();
  }

  // --- Dropdown ---
  let activeDropdown = null;
  let dropdownIdx = -1;
  let dropdownAction = null;

  function openDropdown(opts, onSelect) {
    closeDropdown();
    const el = document.createElement('div');
    el.className = 'setting-dropdown';
    dropdownIdx = opts.findIndex(o => o.active);
    if (dropdownIdx < 0) dropdownIdx = 0;
    dropdownAction = onSelect;
    opts.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'opt' + (o.active ? ' active' : '') + (i === dropdownIdx ? ' focused' : '');
      d.textContent = o.label;
      d.addEventListener('click', () => { onSelect(i); closeDropdown(); });
      el.appendChild(d);
    });
    document.body.appendChild(el);
    activeDropdown = el;
    const f = el.querySelector('.opt.focused');
    if (f) f.scrollIntoView({ block: 'nearest' });
  }
  function closeDropdown() {
    if (activeDropdown) { activeDropdown.remove(); activeDropdown = null; dropdownAction = null; }
  }
  function dropdownNav(key) {
    if (!activeDropdown) return false;
    const items = activeDropdown.querySelectorAll('.opt');
    if (key === 'ArrowDown' || key === 'ArrowRight') {
      dropdownIdx = Math.min(dropdownIdx + 1, items.length - 1);
    } else if (key === 'ArrowUp' || key === 'ArrowLeft') {
      dropdownIdx = Math.max(dropdownIdx - 1, 0);
    } else if (key === 'Enter') {
      if (dropdownAction) dropdownAction(dropdownIdx);
      closeDropdown(); return true;
    } else if (key === 'Escape' || key === 'Tab') {
      closeDropdown(); return true;
    } else { return false; }
    items.forEach((el, i) => el.classList.toggle('focused', i === dropdownIdx));
    items[dropdownIdx].scrollIntoView({ block: 'nearest' });
    return true;
  }
  function openThemeDropdown() {
    if (activeDropdown) { closeDropdown(); return; }
    openDropdown(
      themeKeys.map(k => ({ label: themes[k].name || k, active: k === currentTheme })),
      i => { currentTheme = themeKeys[i]; applyTheme(); }
    );
  }
  function openFontDropdown() {
    if (FONTS.length === 0) return;
    if (activeDropdown) { closeDropdown(); return; }
    openDropdown(
      FONTS.map((f, i) => ({ label: f.label, active: i === currentFont })),
      i => { currentFont = i; applyFont(); }
    );
  }

  async function loadAndRender() {
    await applySettings();

    let meta;
    try {
      const res = await vfetch('data.json');
      const data = await res.json();
      meta = data[parseInt(fileIdx)];
    } catch(e) { document.getElementById('loading').textContent = 'Failed to load metadata.'; return; }

    if (!meta) { document.getElementById('loading').textContent = 'File not found.'; return; }
    document.title = meta.filename + ' — javbrain';

    let content;
    try {
      const res = await vfetch('files/' + fileIdx + '.txt');
      content = await res.text();
    } catch(e) { document.getElementById('loading').textContent = 'Failed to load file.'; return; }

    if (meta.ext === '.txt' && /^====.+/m.test(content)) {
      viewerEl.innerHTML = renderFlatDelimited(content);
      buildFlatToc();
    } else if (meta.ext === '.txt') {
      viewerEl.innerHTML = renderTxtWithLines(content);
    } else if (meta.ext === '.jav') {
      viewerEl.innerHTML = renderJav(content);
      buildToc();
    } else {
      viewerEl.innerHTML = renderTxtWithLines(content);
    }

    if (searchQuery) highlightSearchTerms(viewerEl, searchQuery);

    if (targetLine) {
      const lineEl = document.getElementById('L' + targetLine);
      if (lineEl) {
        setTimeout(() => {
          lineEl.scrollIntoView({ block: 'center' });
          lineEl.style.background = 'var(--highlight-bg)';
          lineEl.style.transition = 'background 2s';
          setTimeout(() => { lineEl.style.background = ''; }, 3000);
        }, 100);
      } else if (searchQuery) scrollToFirstMark(viewerEl);
    } else if (searchQuery) scrollToFirstMark(viewerEl);
  }

  function scrollToFirstMark(container) {
    const m = container.querySelector('mark');
    if (m) setTimeout(() => m.scrollIntoView({ block: 'center' }), 100);
  }

  const LIST_RE = /^\s*(-|●|·|▶|•|\d+\.)\s/;

  function renderTxtWithLines(content) {
    const lines = content.split('\n');
    let html = '<pre class="txt-content">';
    lines.forEach((line, i) => {
      const cls = LIST_RE.test(line) ? 'txt-line list-line' : 'txt-line';
      html += '<span id="L' + (i + 1) + '" class="' + cls + '">' + smartQuotes(escHtml(line)) + '</span>\n';
    });
    return html + '</pre>';
  }

  // --- Flat delimited renderer for ==== files ---
  function renderFlatDelimited(content) {
    const lines = content.split('\n');
    let html = '<div class="flat-content">';
    let sectionIdx = 0;
    let currentLabel = '';
    let currentLines = [];

    function flushSection() {
      if (!currentLabel && currentLines.join('').trim() === '') return;
      if (currentLabel || currentLines.length > 0) {
        html += '<div class="flat-section" id="FS' + sectionIdx + '">';
        if (currentLabel) {
          html += '<div class="flat-section-label">' + escHtml(currentLabel) + '</div>';
        }
        html += '<pre>' + escHtml(currentLines.join('\n')) + '</pre>';
        html += '</div>';
        sectionIdx++;
      }
    }

    for (const line of lines) {
      if (/^====/.test(line)) {
        flushSection();
        // Extract label: everything after ==== markers, trim
        currentLabel = line.replace(/^=+\s*/, '').replace(/\s*=+$/, '').trim();
        currentLines = [];
      } else {
        currentLines.push(line);
      }
    }
    flushSection();
    html += '</div>';
    return html;
  }

  function buildFlatToc() {
    const sections = viewerEl.querySelectorAll('.flat-section[id]');
    if (sections.length === 0) { tocEl.classList.add('empty'); return; }
    tocEl.classList.remove('empty');

    tocItems = [];
    sections.forEach((el, i) => {
      const label = el.querySelector('.flat-section-label');
      const title = label ? label.textContent : '(section ' + i + ')';
      tocItems.push({
        id: el.id,
        title: title,
        depth: 0,
        parentIdx: -1,
        hasChildren: false,
        collapsed: false
      });
    });

    renderToc();
    tocEl.innerHTML += '<div class="toc-hint"></div>'; updateHint();
  }

  function highlightSearchTerms(container, query) {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (terms.length === 0) return;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    for (const node of textNodes) {
      const text = node.textContent;
      const lower = text.toLowerCase();
      let positions = [];
      for (const t of terms) {
        let pos = 0;
        while (true) { const idx = lower.indexOf(t, pos); if (idx === -1) break; positions.push([idx, idx + t.length]); pos = idx + 1; }
      }
      if (positions.length === 0) continue;
      positions.sort((a, b) => a[0] - b[0]);
      const merged = [positions[0]];
      for (let i = 1; i < positions.length; i++) {
        const last = merged[merged.length - 1];
        if (positions[i][0] <= last[1]) last[1] = Math.max(last[1], positions[i][1]);
        else merged.push(positions[i]);
      }
      const frag = document.createDocumentFragment();
      let prev = 0;
      for (const [s, e] of merged) {
        if (s > prev) frag.appendChild(document.createTextNode(text.slice(prev, s)));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(s, e);
        frag.appendChild(mark);
        prev = e;
      }
      if (prev < text.length) frag.appendChild(document.createTextNode(text.slice(prev)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function smartQuotes(s) {
    // Double quotes
    s = s.replace(/(^|[\s(\[{])"/g, '$1\u201c');
    s = s.replace(/"/g, '\u201d');
    // Single quotes / apostrophes
    s = s.replace(/(^|[\s(\[{])'/g, '$1\u2018');
    s = s.replace(/'/g, '\u2019');
    return s;
  }

  // --- Jav Parser ---
  let blockIdCounter = 0;

  function renderJav(src) {
    blockIdCounter = 0;
    const tokens = tokenizeJav(src);
    return renderJavTokens(tokens, 0);
  }

  function tokenizeJav(src) {
    const result = [];
    let i = 0;
    while (i < src.length) {
      const bracketIdx = findUnescapedBracket(src, i);
      if (bracketIdx === -1) {
        const rest = src.slice(i).trim();
        if (rest) result.push({ type: 'text', value: rest });
        break;
      }
      let titleStart = bracketIdx - 1;
      while (titleStart >= i && src[titleStart] !== '\n') titleStart--;
      titleStart++;
      const preText = src.slice(i, titleStart).trim();
      if (preText) result.push({ type: 'text', value: preText });
      const title = src.slice(titleStart, bracketIdx).trim();
      const closeIdx = findMatchingClose(src, bracketIdx);
      if (closeIdx === -1) {
        result.push({ type: 'text', value: src.slice(titleStart).trim() });
        break;
      }
      const inner = src.slice(bracketIdx + 1, closeIdx);
      const children = tokenizeJav(inner);
      result.push({ type: 'block', title: title, children: children });
      i = closeIdx + 1;
    }
    return result;
  }

  function findUnescapedBracket(src, from) {
    for (let i = from; i < src.length; i++) {
      if (src[i] === '[' && (i === 0 || src[i-1] !== '\\')) return i;
    }
    return -1;
  }

  function findMatchingClose(src, openIdx) {
    let depth = 1;
    for (let i = openIdx + 1; i < src.length; i++) {
      if (src[i] === '\\' && i + 1 < src.length && (src[i+1] === '[' || src[i+1] === ']')) { i++; continue; }
      if (src[i] === '[') depth++;
      if (src[i] === ']') { depth--; if (depth === 0) return i; }
    }
    return -1;
  }

  function renderJavTokens(tokens, depth) {
    let html = '';
    for (const tok of tokens) {
      if (tok.type === 'text') {
        html += renderJavText(tok.value);
      } else if (tok.type === 'block') {
        const id = 'B' + (blockIdCounter++);
        html += '<div class="jav-block" id="' + id + '" data-depth="' + depth + '">';
        if (tok.title) html += '<div class="jav-block-label">' + escHtml(tok.title) + '</div>';
        html += '<div class="jav-block-body">';
        html += renderJavTokens(tok.children, depth + 1);
        html += '</div></div>';
      }
    }
    return html;
  }

  function renderJavText(text) {
    const paras = text.split(/\n/);
    let html = '';
    for (const p of paras) {
      const trimmed = p.trim();
      if (!trimmed) continue;
      const cls = LIST_RE.test(trimmed) ? 'jav-para list-line' : 'jav-para';
      html += '<div class="' + cls + '">' + formatInline(trimmed) + '</div>';
    }
    return html;
  }

  function formatInline(text) {
    let s = escHtml(text);
    s = smartQuotes(s);
    s = s.replace(/\\\\([^\\]+?)\\\\/g, '<span class="jav-callout">$1</span>');
    s = s.replace(/\\([^\\]+?)\\/g, '<span class="jav-note">$1</span>');
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<span class="jav-bold">$1</span>');
    s = s.replace(/\*([^*]+?)\*/g, '<span class="jav-italic">$1</span>');
    // Wrap curly-quoted text
    s = s.replace(/\u201c([^\u201d]*?)\u201d/g, '<span class="jav-quote">\u201c$1\u201d</span>');
    return s;
  }

  // --- TOC ---
  function buildToc() {
    const blocks = viewerEl.querySelectorAll('.jav-block[id]');
    if (blocks.length === 0) { tocEl.classList.add('empty'); return; }
    tocEl.classList.remove('empty');

    tocItems = [];
    const stack = []; // track parent indices by depth

    blocks.forEach((el) => {
      const id = el.id;
      const depth = parseInt(el.dataset.depth) || 0;
      const label = el.querySelector(':scope > .jav-block-label');
      const title = label ? label.textContent : '(untitled)';

      // Has child blocks?
      const hasChildren = el.querySelector(':scope > .jav-block-body > .jav-block[id]') !== null;

      // Find parent
      while (stack.length > 0 && stack[stack.length - 1].depth >= depth) stack.pop();
      const parentIdx = stack.length > 0 ? stack[stack.length - 1].idx : -1;

      const idx = tocItems.length;
      tocItems.push({
        id: id,
        title: title,
        depth: depth,
        parentIdx: parentIdx,
        hasChildren: hasChildren,
        collapsed: false
      });

      if (parentIdx >= 0) {
        if (!tocItems[parentIdx].childIndices) tocItems[parentIdx].childIndices = [];
        tocItems[parentIdx].childIndices.push(idx);
      }

      stack.push({ depth: depth, idx: idx });
    });

    renderToc();
    tocEl.innerHTML += '<div class="toc-hint"></div>'; updateHint();
  }

  function renderToc() {
    const visibleSet = new Set();
    // Determine visible items
    for (let i = 0; i < tocItems.length; i++) {
      let visible = true;
      let pi = tocItems[i].parentIdx;
      while (pi >= 0) {
        if (tocItems[pi].collapsed) { visible = false; break; }
        pi = tocItems[pi].parentIdx;
      }
      if (visible) visibleSet.add(i);
    }

    let html = '';
    for (let i = 0; i < tocItems.length; i++) {
      const t = tocItems[i];
      const hidden = visibleSet.has(i) ? '' : ' hidden';
      const sel = (i === tocSelected && tocFocused) ? ' selected' : '';
      const depthCls = 'depth-' + Math.min(t.depth, 4);
      let arrow = '';
      if (t.hasChildren) {
        arrow = '<span class="toc-arrow">' + (t.collapsed ? '&#9654;' : '&#9660;') + '</span>';
      } else {
        arrow = '<span class="toc-arrow"></span>';
      }
      html += '<div class="toc-item ' + depthCls + sel + hidden + '" data-idx="' + i + '">' +
        arrow + escHtml(t.title) + '</div>';
    }
    // Keep the hint if present
    const hint = tocEl.querySelector('.toc-hint');
    tocEl.innerHTML = html;
    if (hint) tocEl.appendChild(hint);

    // Scroll selected into view
    const selEl = tocEl.querySelector('.toc-item.selected');
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function getVisibleTocIndices() {
    const vis = [];
    for (let i = 0; i < tocItems.length; i++) {
      let visible = true;
      let pi = tocItems[i].parentIdx;
      while (pi >= 0) {
        if (tocItems[pi].collapsed) { visible = false; break; }
        pi = tocItems[pi].parentIdx;
      }
      if (visible) vis.push(i);
    }
    return vis;
  }

  function tocNav(key, ctrl) {
    const vis = getVisibleTocIndices();
    if (vis.length === 0) return;
    const curVisIdx = vis.indexOf(tocSelected);

    if (key === 'ArrowDown') {
      if (curVisIdx < vis.length - 1) {
        tocSelected = vis[curVisIdx + 1];
        renderToc();
        scrollToBlock(tocItems[tocSelected].id);
      }
    } else if (key === 'ArrowUp') {
      if (curVisIdx > 0) {
        tocSelected = vis[curVisIdx - 1];
        renderToc();
        scrollToBlock(tocItems[tocSelected].id);
      }
    } else if (key === 'ArrowRight') {
      if (ctrl) {
        for (const t of tocItems) { if (t.hasChildren) t.collapsed = false; }
        renderToc();
      } else {
        const t = tocItems[tocSelected];
        if (t.hasChildren && t.collapsed) {
          t.collapsed = false;
          renderToc();
        }
      }
    } else if (key === 'ArrowLeft') {
      if (ctrl) {
        for (const t of tocItems) { if (t.hasChildren) t.collapsed = true; }
        renderToc();
      } else {
        const t = tocItems[tocSelected];
        if (t.hasChildren && !t.collapsed) {
          t.collapsed = true;
          renderToc();
        } else if (t.parentIdx >= 0) {
          tocSelected = t.parentIdx;
          renderToc();
          scrollToBlock(tocItems[tocSelected].id);
        }
      }
    }
  }

  function scrollToBlock(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // --- Keyboard ---
  document.addEventListener('keydown', function(e) {
    if (activeDropdown) {
      e.preventDefault();
      dropdownNav(e.key);
      return;
    }

    if (e.key === ' ' || e.code === 'Space') {
      // Don't intercept if user is in an input
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (tocItems.length === 0) return;
      e.preventDefault();
      if (tocFocused) {
        tocFocused = false;
        tocEl.classList.remove('focused');
        tocEl.classList.remove('mobile-open');
        renderToc();
        viewerEl.focus();
      } else {
        tocFocused = true;
        tocEl.classList.add('focused');
        tocEl.classList.add('mobile-open');
        renderToc();
        scrollToBlock(tocItems[tocSelected].id);
      }
      return;
    }

    if (e.key === 'Escape' && tocFocused) {
      e.preventDefault();
      tocFocused = false;
      tocEl.classList.remove('focused');
      tocEl.classList.remove('mobile-open');
      renderToc();
      viewerEl.focus();
      return;
    }

    if (tocFocused && ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
      tocNav(e.key, e.ctrlKey);
      return;
    }

    if (tocFocused && e.key === 'Enter') {
      e.preventDefault();
      const t = tocItems[tocSelected];
      if (!t) return;
      const el = document.getElementById(t.id);
      if (!el) return;
      const text = el.innerText || el.textContent;
      function doCopyEnter(str) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(str).catch(() => fallbackCopyEnter(str));
        }
        return fallbackCopyEnter(str);
      }
      function fallbackCopyEnter(str) {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      doCopyEnter(text);
      const selItem = tocEl.querySelector('.toc-item.selected');
      if (selItem) {
        const orig = selItem.innerHTML;
        selItem.innerHTML = '<span style="opacity:0.5">copied</span>';
        setTimeout(() => { selItem.innerHTML = orig; }, 800);
      }
      return;
    }

    // Theme dropdown
    if (e.key.toLowerCase() === 't' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      openThemeDropdown();
      return;
    }

    // Font dropdown
    if (e.key.toLowerCase() === 'f' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      openFontDropdown();
      return;
    }

    // Toggle depth styling (bg, borders, rules)
    if (e.key.toLowerCase() === 'l' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      document.body.classList.toggle('depth-lines-off');
      localStorage.setItem('jb-lines', document.body.classList.contains('depth-lines-off') ? 'off' : 'on');
      return;
    }
  });

  // Click on TOC items
  tocEl.addEventListener('click', function(e) {
    const item = e.target.closest('.toc-item');
    if (!item) return;
    const idx = parseInt(item.dataset.idx);
    tocSelected = idx;
    tocFocused = true;
    tocEl.classList.add('focused');
    renderToc();
    scrollToBlock(tocItems[idx].id);
  });

  tocEl.addEventListener('contextmenu', function(e) {
    const item = e.target.closest('.toc-item');
    if (!item) return;
    e.preventDefault();
    const idx = parseInt(item.dataset.idx);
    const t = tocItems[idx];
    const el = document.getElementById(t.id);
    if (!el) return;
    const text = el.innerText || el.textContent;

    // Copy with fallback
    function doCopy(str) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(str).catch(() => fallbackCopy(str));
      }
      return fallbackCopy(str);
    }
    function fallbackCopy(str) {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    doCopy(text);
    const orig = item.innerHTML;
    item.innerHTML = '<span style="opacity:0.5">copied</span>';
    setTimeout(() => { item.innerHTML = orig; }, 800);
  });

  // --- Touch bar wiring ---
  document.querySelectorAll('#touch-bar .tb').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      if (activeDropdown) { closeDropdown(); return; }
      const act = this.dataset.act;
      if (act === 'toc') {
        const isOpen = tocEl.classList.toggle('mobile-open');
        if (isOpen) {
          tocFocused = true;
          tocEl.classList.add('focused');
          renderToc();
          if (tocItems[tocSelected]) scrollToBlock(tocItems[tocSelected].id);
        } else {
          tocFocused = false;
          tocEl.classList.remove('focused');
          renderToc();
          viewerEl.focus();
        }
      }
      else if (act === 'theme') openThemeDropdown();
      else if (act === 'font') openFontDropdown();
      else if (act === 'lines') {
        document.body.classList.toggle('depth-lines-off');
        localStorage.setItem('jb-lines', document.body.classList.contains('depth-lines-off') ? 'off' : 'on');
      }
    });
  });

  // Close mobile TOC on item click (mobile only)
  tocEl.addEventListener('click', function() {
    if (window.innerWidth <= 600) {
      setTimeout(() => {
        tocEl.classList.remove('mobile-open');
      }, 150);
    }
  });

  loadAndRender().then(() => {
    viewerEl.focus();
    if (localStorage.getItem('jb-lines') === 'off') {
      document.body.classList.add('depth-lines-off');
    }
  });
})();
</script>
</body>
</html>
